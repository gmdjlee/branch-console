# =============================================================================
# analogue_seed.yaml — 유사사례 라이브러리 시드 | schema: analogue-seed/1
# -----------------------------------------------------------------------------
# 규칙:
#  - 본 26건은 Advisor가 선별한 시드다. Worker는 각 건을 실데이터로 검증하며,
#    날짜·유형이 데이터와 어긋나면 수정하지 말고 게이트 리포트에 이견으로 기록한다.
#  - 2025 하반기~2026 사건 추가는 AL-04에서 뉴스·데이터 검증을 거쳐서만 수행한다.
#  - type은 contracts/snapshot.py EventClassification.type과 동일 어휘를 쓴다.
#  - anchor_date = 사건 기준일(리드타임 측정 원점), window = 지표·경로 관찰 창.
# =============================================================================
schema: analogue-seed/1
version: 0.2.0

outcome_spec:
  price_paths: { horizons_days: [5, 20, 60], assets: [KOSPI, KOSDAQ, USDKRW] }
  sector_paths:
    horizons_days: [20]
    krx_sectors: [은행, 증권, 보험, 전기전자, 화학, 건설, 운수장비, 유통, 통신, 음식료]   # 지수코드는 AL-02에서 실측 (K-13)
  trigger_vector: all_enabled_indicators_at_anchor   # 보정판 레지스트리 기준

