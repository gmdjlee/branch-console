# =============================================================================
# statemachine.yaml — 복합 국면 상태기계 (SSOT)
# branch-console P0 | schema: statemachine/1
# -----------------------------------------------------------------------------
# 평가 틱(run): schedules.evaluation 참조. sustain/dwell 카운트 단위는 "틱".
# distinct_axes: severity >= warn(2)인 지표가 존재하는 서로 다른 axis 개수.
# =============================================================================

schema: statemachine/1
phases: [GREEN, AMBER, ORANGE, RED]
initial_phase: GREEN

upgrade:                      # 조건 충족이 promote_sustain_ticks(profiles.*) 연속이어야 승격 (D-16)
  rules:
    AMBER:  { composite_gte: 20, or_any_crit: true }
    # or_any_extreme: MT0-08(2026-08-04) — ① 변형 채택(GATE_GM0 후속 결정). distinct_axes_gte는
    # 우회 대상이 아니다(AD-10, composite_gte만 우회). D-26 짝지음(engine_ref/statemachine.py
    # D-25 §4)이 엔진 의미론으로 자동 적용돼 any_extreme 지속 중 exit_ORANGE를 차단한다 —
    # 이 파일에는 별도 짝지음 키가 없다(설계 확정, configs 노출 없음).
    ORANGE: { composite_gte: 40, distinct_axes_gte: 2, or_any_extreme: true }
    RED:    { composite_gte: 60, distinct_axes_gte: 3 }

downgrade:                    # 히스테리시스: 진입선보다 낮은 이탈선 + 긴 유지
  rules:
    exit_RED:    { composite_lt: 50 }
    exit_ORANGE: { composite_lt: 32 }
    exit_AMBER:  { composite_lt: 14 }

# 프로파일 이원화 (D-16, CHANGES_V3 §2.1). 엔진은 프로파일 키를 주입받는다(D-16).
# 전이 구조·composite 공식(D-02)·distinct_axes 요건·skip_levels는 프로파일과 무관하게 동일 —
# 달라지는 것은 틱 단위 카운트뿐.
profiles:
  server_intraday:                 # 기존 값 그대로 이관 (의미 변화 없음)
    tick: 30m
    promote_sustain_ticks: 2
    demote_below_ticks: 6
    min_dwell_ticks: 4
    reentry_cooldown_ticks: 6      # 하향 직후 재승격 시 sustain 카운트 리셋 + 쿨다운
  mobile_daily:                    # BT-03 스윕 선정 반영(MT0-05④, 0.3.0-rc 조건부).
    tick: 1d
    promote_sustain_ticks: 1       # 스윕 선정: 기준선과 동일 등가류(golden상 유일 가용값 — 2는 56/56 전건 탈락) -> 무변경.
    demote_below_ticks: 3          # 스윕 선정: 기준선과 동일값이 rank 1위(§6 플래핑 게이트 통과 6조합 중 최상위).
    min_dwell_ticks: 5             # 스윕 선정 반영: 2 -> 5 (§6 mobile 플래핑 게이트 통과 필수 조건, O3-1 dwell>demote 영역).
    reentry_cooldown_ticks: 2      # 스윕 선정으로 확정(이전 미정의, 엔진 기본값 0이었음) — BT-03 §6 mobile 플래핑 게이트 통과 조건.
    catchup_max_ticks: 20          # M1 council M-17b — 완결 사이클 10틱(demote_below 3 + min_dwell 5 + cooldown 2)의
                                    # 2배 여유. 초과 공백은 composite=NULL 동결 행 + gap_reason으로 절단(M-34, MT1-06e).
    # confirm_time_kst: 미기입 — AD-3b 확정 시각 실측(MT1-00g)이 아직 3거래일×6시점 폴링을 완료하지 않았다
    # (PROGRESS.md 2026-08-07). 17:00 가설은 있으나 SSOT에는 실측 확정 후에만 기입한다(추측 금지, D-04).
    # 코드는 이 키의 부재를 명시 실패로 처리한다(ProfileParams.confirmTimeKst=null, MT1-06 브리프 aaa 요건 1).

skip_levels: true             # 조건 충족 시 GREEN->ORANGE 등 단계 건너뜀 허용 (2024-08-05형 갭 이벤트)

hmm_confirmation:             # P2에서 활성화: RED 승격의 보조 확인 신호
  enabled: false
  rule: "high_vol_regime_posterior >= 0.8 -> RED 요구 축 수 3->2 완화"

actions:
  on_tick:
    - persist_state            # Postgres: phase, composite, fired 목록
    - lake_append              # Parquet PIT 기록
  on_enter:
    AMBER:  [telegram_notify, tag_daily_digest]
    ORANGE: [telegram_alert, generate_scenario_report]
    RED:    [telegram_alert, generate_scenario_report, schedule_session_reviews]
  on_exit:
    RED:    [telegram_notify, generate_postmortem_stub]
    ORANGE: [telegram_notify]

llm_tiering:                   # D-20 확정(2026-08-02). 무날짜 ID는 고정 스냅샷 — 별칭 아님.
  daily_digest:     { model: claude-haiku-4-5-20251001,  web_search: false }
  amber_summary:    { model: claude-sonnet-5,   web_search: false }
  scenario_report:  { model: claude-opus-5,     web_search: true, structured_output: scenario-snapshot/1 }
  # 변경 절차: 분기 C-주기에 모델 목록 실조회 → 폐기 일정 확인 → 여기와 .claude/agents/* 동시 갱신(D-20 §20.3)

schedules:
  evaluation:                  # 평가 틱 정의 (KST)
    - { id: kr_intraday, cron: "*/30 9-15 * * 1-5", note: "09:00–15:30 장중" }
    - { id: kr_close,    cron: "0 17 * * 1-5",      note: "KR 마감 확정치" }
    - { id: us_close,    cron: "30 7 * * 1-5",      note: "미국 마감 반영" }
  collection:
    - { id: fred_daily,  cron: "0 8 * * 1-5" }
    - { id: daily_us,    cron: "20 7 * * 1-5" }
    - { id: daily_kr,    cron: "50 16 * * 1-5" }
  holidays: krx_calendar       # exchange_calendars 'XKRX' 사용, 휴장일 틱 스킵
