[project]
name = "branch-console"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "exchange-calendars>=4.13.2",
    "numpy>=2.5.1",
    "pandas>=2.2,<3",
    "pyarrow>=25.0.0",
    "pydantic>=2",
    "pykrx>=1.2.8",
    "pyyaml",
    "requests>=2.34.2",
    "setuptools<81",
    "yfinance>=1.5.2",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
# 룰셋은 ruff 기본값 유지(AAA §2.3 "기본 룰셋"), 재현성은 uv.lock 버전 핀이 담당.
# .md 제외: ruff format이 설계 문서 내 예시 코드펜스를 재작성하는 것 방지 (aaa-critic O-1, ⓑ 채택).
extend-exclude = ["*.md"]
