# 공유 detekt 설정 — 모든 모듈이 buildUponDefaultConfig=true로 이 파일을 오버레이한다.
# SSOT 규율(CLAUDE.md §1): 임계·가중치 리터럴은 configs/*.yaml에만 있어야 한다. MagicNumber
# 룰의 예외 목록은 "숫자 스타일 허용"이지 임계값 SSOT 우회가 아니다(docs/plans/M1_PLAN_A.md §2.6).
naming:
  # MT1-08b — Jetpack Compose 공식 스타일 가이드는 @Composable 함수를 PascalCase로 요구한다
  # (ktlint 쪽은 .editorconfig의 ktlint_function_naming_ignore_when_annotated_with으로 동일 예외).
  FunctionNaming:
    active: true
    ignoreAnnotated:
      - 'Composable'

style:
  MaxLineLength:
    active: true
    # ktlint(.editorconfig 미설정 시 기본 140)와 동일 상한으로 맞춘다 — 두 린터가 서로 다른
    # 기준으로 같은 파일을 다르게 판정하지 않도록.
    maxLineLength: 140
  MagicNumber:
    active: true
    ignoreNumbers:
      - '-1'
      - '0'
      - '1'
      - '2'
      - '100.0'
      - '3.0'
    ignoreAnnotated:
      - 'Test'
    ignoreHashCodeFunction: true
    ignorePropertyDeclaration: true
    ignoreLocalVariableDeclaration: false
    ignoreConstantDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotation: true
    ignoreNamedArgument: true
    ignoreEnums: false
    ignoreRanges: false

complexity:
  LongMethod:
    active: true
    threshold: 60
